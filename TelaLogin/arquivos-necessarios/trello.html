<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de login do Trello</title>

      <script src="https://unpkg.com/@codans/trello"></script>

</head>
<body>
<img src="img/trello.svg" alt="Logo do Trello" width="200">

    <h1>Fazer login no trello</h1>

    <form action="" method="GET">
      <input type = "text" name ="email" placeholder="Digite seu e-mail" id="email">
      <input type = "password" name="senha" placeholder="Digite sua senha" id="senha">
      <input type = "submit" value="Fazer login" id="entrar">
       
       
       <span>ou</span>

      

      <button>
        <img src="img/google.svg" alt="Ícone do Google" width="20"> 
        Continuar com Google
      </button>
      
      <button>
        <img src='img/apple.svg' alt='Ícone da Apple' width="20">
        Continuar com Apple
      </button>
      
      <button>
        <img src='img/microsoft.svg' alt='Ícone da Microsoft' width="20">
        Continuar com Microsoft</button>
      
      <button>
        <img src='img/slack.svg' alt='Ícone do Slack' width="20">
        Continuar com o Slack</button>
      

    </form>

    <img src="img/atlassian.svg" alt="Logo do Trello" width="200">
    <img src="img/analytics.svg" alt="Logo do Trello" width="200">
    <img src="img/interactive.svg" alt="Logo do Trello" width="200">
</body>
</html>
