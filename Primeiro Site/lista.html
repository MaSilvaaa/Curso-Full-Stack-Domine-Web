<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type = "image/jpg" href = "images/AerosolComoUsar.jpg">

    <style>
        body{
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #lista{
            background-image: none;
            background-color: black;
            color: white;
            flex: 1;
        }

        main{
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #elementosDaLista{
            border: 2px double white;
            overflow-x: auto;
            min-height: 200px;
            max-height: 200px;
            list-style: none;
            padding: 10px
        }

        #criarTarefa{
            color: white;
        }

        #removerTarefa{
            color: white;
        }

        #tarefaID{
            border: 2px double white;
            background-color: black;
            color: white;
        }

        #tarefaID:focus{
            border: 4px double white;
        }

        #addForm{
            display: flex;
            flex-direction: column;
            min-width: 300px;
            width: 300px;
            min-height: 150px;
            height: 150px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: black;
            border: 5px double white;
            visibility: hidden;
            padding: 30px 10px 0 10px;
        }

        #enviarAdd{
            color: white;
            margin: 10px 0;
        }

        #nomeTarefa, #descTarefa{
            border: 1px double white;
            background-color: black;
            color: white;
        }
        
        p{
            border: 3px double white;
        }

        .did{
            margin: 0 25px;
            width: 20px;
            flex: left;
        }

        .delete{
            width: 20px;
            margin: 0 50px;
            visibility: hidden;
            flex: right;
        }

        .delete:checked{
            accent-color: red;
        }

        #confirmarRem{
            border-color: red;
            color: white;
            position: relative;
            left: 85%;
            visibility: hidden;
        }

        .flexTarefa{
            display: flex;
            flex-direction: row;
            background-color: black;
            background-image: none;
        }

    </style>
</head>

<body>
    <header> 
        <a href = "https://www.youtube.com/watch?v=shzp4KSk-dU" target = "_blank">
            <img class = "logo" src = "images/AerosolComoUsar.png" alt="Aerosol" width="150">
        </a>

        <nav class="botoes-container">
            <ul style = "list-style-type: none; display: flex; justify-content: center; align-items: flex-start; grid-gap: 10px;">
                <li><a class="botoes" ID = "home" href="index.html">Home</a></li>
                <li><a class="botoes" ID = "aval" href="avaliacoes.html">Avaliações de Refris</a></li>
                <li><a class="botoes" ID = "sobre" href="miguel.html">Sobre mim</a></li>
                <li><a class="botoes" ID = "forms" href="formsTest.html">Teste de Formulários</a></li>
            </ul>
        </nav>

        <a href = "https://www.github.com/masilvaaa" target = "_blank">
            <img class = "logo" src = "images/github.png" alt="GitHub" width="150">
        </a>
    </header>
    <main>
        <div id = "lista">
            <ul id = "elementosDaLista"></ul>

            <button class = "botoes" id = "criarTarefa" onclick = "CriarTarefa()">Adicionar</button>
            <button class = "botoes" id = "removerTarefa" onclick = "RemoverTarefa()">Remover</button>
            <button class = "botoes" id = "confirmarRem">Confirmar</button>
            
            <form id = "addForm" action = "lista.js" method = "post">
                <input id = "nomeTarefa" placeholder="Insira o nome da tarefa:" name = "nome">
                <br>
                <input id = "descTarefa" placeholder="Insira a descrição:" name = "desc">
                <br>
                <button type = "submit" class = "botoes" id = "enviarAdd">Adicionar</button>
            </form>
        </div>
    </main>
    
    <footer>
        <p style="text-align: center;">
            E-mail: miguel1424844@gmail.com | Telefone: 51 995412626
        </p>
    </footer>
</body>

<script src = "code/lista.js"></script>
</html>
