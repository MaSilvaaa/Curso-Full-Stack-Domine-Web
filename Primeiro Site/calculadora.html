<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type = "image/jpg" href = "images/AerosolComoUsar.jpg">

    <style>
        body{
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        #calcGrid > button{
            background-color: rgb(211, 208, 208);
            margin: 0;
            padding: 0;
            min-width: 30px;
            min-height: 30px;
            border: 4px rgb(172, 153, 153) solid;
        }

        #calcGrid > button:hover{
            background-color: rgb(175, 174, 174);
        }

        #calcGrid{
            padding: 45px 0;
            display: grid;
            background-color: rgb(39, 39, 39);
            align-items: center;
            justify-content: center;
            grid-template-rows: repeat(6, 30px);
            grid-template-columns: repeat(4, 15%);
            gap: 10px 10px;
            border: 5px rgb(114, 105, 105) solid;
            border-radius: 20px;
            min-width: 250px;
            max-width: 250px;
            min-height: 280px;
            max-height: 280px;
        }

        #calcGrid > textarea{
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
            grid-area: 0;
            grid-column: span 4;
            border: 4px rgb(172, 153, 153) solid;
            pointer-events: none;
            font-size: 15px;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #calcBody{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            min-width: 250px;
        }

        #calcGrid > #equals{
            grid-column: span 4;
            background-color: rgb(0, 255, 170);
            border-color: rgb(216, 216, 216);
        }

        #calcGrid > #equals:hover{
            background-color: rgb(1, 189, 126);
        }

        #secaoPrincipal{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        #skel{
            position: fixed;
            left: 10%;
            bottom:50%;
            width: 300px;
            pointer-events: none;
            visibility: hidden;
        }

        #calcGrid > button.op{
            background-color: orange;
            border-color: rgb(216, 216, 216);
        }

        #calcGrid > button.op:hover{
            background-color: rgb(223, 145, 0);
        }

        #calcGrid > button#ce{
            background-color: rgb(255, 63, 63);
            border-color: rgb(216, 216, 216);
        }

        #calcGrid > button#ce:hover{
            background-color: rgb(185, 45, 45);
        }
    </style>
</head>

<body>
<image src = "./images/bosnov.gif" id = "skel">
    <header> 
        <a href = "https://www.youtube.com/watch?v=shzp4KSk-dU" target = "_blank">
            <img class = "logo" src = "images/AerosolComoUsar.png" alt="Aerosol" width="150">
        </a>

        <nav class="botoes-container">
            <ul style = "list-style-type: none; display: flex; justify-content: center; align-items: flex-start; grid-gap: 10px;">
                <li><a class="botoes" ID = "home" href="index.html">Home</a></li>
                <li><a class="botoes" ID = "aval" href="avaliacoes.html">Avaliações de Refris</a></li>
                <li><a class="botoes" ID = "sobre" href="miguel.html">Sobre mim</a></li>
                <li><a class="botoes" ID = "forms" href="formsTest.html">Teste de Formulários</a></li>
            </ul>
        </nav>

        <a href = "https://www.github.com/masilvaaa" target = "_blank">
            <img class = "logo" src = "images/github.png" alt="GitHub" width="150">
        </a>
    </header>
    <main id = "secaoPrincipal">
        <div id = "calcBody">
            <grid id = "calcGrid">
                <textarea id = "tela" value = "teste" readonly></textarea>
                <button onclick = "ProcessarNumero(1)" class = "numero">
                    a
                </button>
                <button onclick = "ProcessarNumero(2)" class = "numero">
                    
                </button>
                <button onclick = "ProcessarNumero(3)" class = "numero">
                    
                </button>
                 <button onclick = "FazerOperacao('/')" id = "div" class = "op">
                    /
                </button>
                <button onclick = "ProcessarNumero(4)" class = "numero">
                    
                </button>
                <button onclick = "ProcessarNumero(5)" class = "numero">
                    
                </button>
                <button onclick = "ProcessarNumero(6)" class = "numero">
                    
                </button>
                <button onclick = "FazerOperacao('+')" id = "mais" class = "op">
                    +
                </button>
                <button onclick = "ProcessarNumero(7)" class = "numero">
            
                </button>
                <button onclick = "ProcessarNumero(8)" class = "numero">
                    
                </button>
                <button onclick = "ProcessarNumero(9)" class = "numero">
                    
                </button>
                <button onclick = "FazerOperacao('*')" id = "multi" class = "op">
                    *
                </button>
                <button onclick = "Doom()"></button>
                <button onclick = "ProcessarNumero(0)" class = "numero">
                    
                </button>
                <button onclick = "LimparTela()" id = "ce">
                    CE
                </button>
                <button onclick = "FazerOperacao('-')" id = "menos" class = "op">-</button>
                <button onclick = "MostrarResultado()" id = "equals">=</button>
            </grid>
        </div>
    </main>
    
    <footer>
        <p style="text-align: center;">
            E-mail: miguel1424844gmail.com | Telefone: 51 995412626
        </p>
    </footer>
</body>

<script src = "code/calculadora.js"></script>
</html>
